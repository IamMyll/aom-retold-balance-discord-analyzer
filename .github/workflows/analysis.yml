name: Discord Chat Analysis

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: 

jobs:
  extract_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Export Discord Logs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          AFTER_DATE=2026-06-25 00:00
          echo "Fetching logs after: $AFTER_DATE"
          
          # Run the official Docker container and mount the workspace to output the file
          docker run --rm -v ${{ github.workspace }}:/out tyrrrz/discordchatexporter export -t "$DISCORD_TOKEN" -c "$CHANNEL_ID" -f Json --after "$AFTER_DATE" -o /out/chat_export.json

      - name: Run AI Analysis
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }} 
        run: python analyze_and_publish.py chat_export.json

      - name: Commit and Push New Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the specific file
          git add index.md
          
          # Commit only if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update latest balance report" && git push)