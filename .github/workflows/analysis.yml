name: Discord Chat Analysis

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch: 

jobs:
  extract_and_publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Export Discord Logs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/out tyrrrz/discordchatexporter export -t "$DISCORD_TOKEN" -c "$CHANNEL_ID" -f Json --after "$(date -d "30 days ago" +'%Y-%m-%d')" -o /out/chat_export.json

      - name: Fix Workspace Permissions
        run: sudo chown -R $USER:$USER ${{ github.workspace }}

      - name: Run AI Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
        run: python analyze_and_publish.py chat_export.json

      - name: Commit and Push New Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add index.md
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update 30-day balance report" && git push)